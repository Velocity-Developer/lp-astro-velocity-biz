name: Deploy on package version update

on:
  push:
    branches:
      - master
    paths:
      - package.json

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      previous-version: ${{ steps.version.outputs.previous-version }}
      current-version: ${{ steps.version.outputs.current-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version change
        id: version
        shell: bash
        run: |
          current_version=$(node -p "require('./package.json').version")
          before_sha="${{ github.event.before }}"

          if [ "$before_sha" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before_sha:package.json" 2>/dev/null; then
            previous_version=$(git show "$before_sha:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          else
            previous_version=""
          fi

          echo "previous-version=$previous_version" >> "$GITHUB_OUTPUT"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"

          if [ "$previous_version" != "$current_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      PUBLIC_META_PIXEL_ID: ${{ secrets.PUBLIC_META_PIXEL_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro Zip
        run: npm run zip

      - name: Upload build.zip via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T ./dist/build.zip \
            "ftp://$FTP_SERVER:21/install/build.zip"
